      - name: Write Kotlin sources (utilities, auth, API)
        run: |
          D=app/src/main/java/com/timmytwoplates/yoto

          cat > $D/Util.kt <<'EOF'
          package com.timmytwoplates.yoto

          import android.content.Context
          import android.graphics.Bitmap
          import android.graphics.BitmapFactory
          import android.os.Handler
          import android.os.Looper
          import android.widget.Toast
          import okhttp3.OkHttpClient
          import okhttp3.Request
          import org.json.JSONArray
          import org.json.JSONObject
          import java.io.File
          import java.text.SimpleDateFormat
          import java.util.Date
          import java.util.Locale

          fun JSONObject.str(k: String): String = if (isNull(k)) "" else optString(k)

          fun findStr(o: JSONObject, key: String, depth: Int = 5): String {
              if (!o.isNull(key)) {
                  val v = o.opt(key)
                  if (v is String && v.isNotEmpty()) return v
              }
              if (depth == 0) return ""
              val it = o.keys()
              while (it.hasNext()) {
                  val v = o.opt(it.next())
                  if (v is JSONObject) {
                      val r = findStr(v, key, depth - 1)
                      if (r.isNotEmpty()) return r
                  }
              }
              return ""
          }

          fun toast(ctx: Context, msg: String) {
              Handler(Looper.getMainLooper()).post {
                  Toast.makeText(ctx.applicationContext, msg, Toast.LENGTH_SHORT).show()
              }
          }

          object Store {
              private fun p(ctx: Context) =
                  ctx.applicationContext.getSharedPreferences("yoto", Context.MODE_PRIVATE)

              fun str(ctx: Context, k: String): String? = p(ctx).getString(k, null)

              fun put(ctx: Context, k: String, v: String?) {
                  val e = p(ctx).edit()
                  if (v == null) e.remove(k) else e.putString(k, v)
                  e.apply()
              }

              fun long(ctx: Context, k: String, d: Long = 0L): Long = p(ctx).getLong(k, d)

              fun putLong(ctx: Context, k: String, v: Long) {
                  p(ctx).edit().putLong(k, v).apply()
              }

              fun int(ctx: Context, k: String, d: Int = 0): Int = p(ctx).getInt(k, d)

              fun putInt(ctx: Context, k: String, v: Int) {
                  p(ctx).edit().putInt(k, v).apply()
              }

              @Synchronized
              fun log(ctx: Context, msg: String) {
                  val t = SimpleDateFormat("HH:mm:ss", Locale.US).format(Date())
                  val old = str(ctx, "log")?.split("\n") ?: emptyList()
                  val all = (old + "$t $msg").takeLast(25)
                  put(ctx, "log", all.joinToString("\n"))
              }
          }

          data class Card(val id: String, val title: String, val cover: String)

          object Library {
              fun load(ctx: Context): List<Card> {
                  val s = Store.str(ctx, "lib") ?: return emptyList()
                  return try {
                      val a = JSONArray(s)
                      (0 until a.length()).map {
                          val o = a.getJSONObject(it)
                          Card(o.str("id"), o.str("title"), o.str("cover"))
                      }
                  } catch (e: Exception) {
                      emptyList()
                  }
              }

              fun save(ctx: Context, cards: List<Card>) {
                  val a = JSONArray()
                  for (c in cards) {
                      a.put(JSONObject().put("id", c.id).put("title", c.title).put("cover", c.cover))
                  }
                  Store.put(ctx, "lib", a.toString())
                  Store.putLong(ctx, "libAt", System.currentTimeMillis())
              }

              fun title(ctx: Context, id: String): String =
                  load(ctx).firstOrNull { it.id == id }?.title ?: ""

              fun stale(ctx: Context): Boolean =
                  System.currentTimeMillis() - Store.long(ctx, "libAt") > 3L * 3600 * 1000 ||
                      load(ctx).isEmpty()
          }

          object Covers {
              private val http = OkHttpClient()

              fun file(ctx: Context, id: String): File {
                  val dir = File(ctx.cacheDir, "covers")
                  dir.mkdirs()
                  return File(dir, id.replace(Regex("[^A-Za-z0-9_-]"), "_") + ".jpg")
              }

              fun ensure(ctx: Context, c: Card) {
                  val f = file(ctx, c.id)
                  if (f.exists() || c.cover.isEmpty()) return
                  try {
                      val bytes = http.newCall(Request.Builder().url(c.cover).build()).execute().use {
                          if (it.isSuccessful) it.body?.bytes() else null
                      } ?: return
                      val bounds = BitmapFactory.Options()
                      bounds.inJustDecodeBounds = true
                      BitmapFactory.decodeByteArray(bytes, 0, bytes.size, bounds)
                      var sample = 1
                      while (bounds.outWidth / (sample * 2) >= 150) sample *= 2
                      val opts = BitmapFactory.Options()
                      opts.inSampleSize = sample
                      val bmp = BitmapFactory.decodeByteArray(bytes, 0, bytes.size, opts) ?: return
                      val h = (bmp.height * 150f / bmp.width).toInt().coerceAtLeast(1)
                      val scaled = Bitmap.createScaledBitmap(bmp, 150, h, true)
                      f.outputStream().use { scaled.compress(Bitmap.CompressFormat.JPEG, 85, it) }
                  } catch (e: Exception) {
                      // leave uncached; the grid shows the title instead
                  }
              }
          }
          EOF

          cat > $D/Auth.kt <<'EOF'
          package com.timmytwoplates.yoto

          import android.content.Context
          import android.util.Base64
          import okhttp3.FormBody
          import okhttp3.OkHttpClient
          import okhttp3.Request
          import org.json.JSONObject
          import java.net.ServerSocket
          import java.net.URLEncoder
          import java.security.MessageDigest
          import java.security.SecureRandom

          object Auth {
              const val CLIENT_ID = "tpc_qNTQxbkyfKzpuTcitzMshV"
              const val REDIRECT = "http://127.0.0.1:8787/callback"
              const val SCOPE =
                  "family:devices:view family:devices:control family:library:view user:content:manage offline_access"

              @Volatile
              var listener: ServerSocket? = null

              private val lock = Any()
              private val http = OkHttpClient()

              fun signedIn(ctx: Context): Boolean = Store.str(ctx, "refresh") != null

              private fun b64(b: ByteArray): String =
                  Base64.encodeToString(b, Base64.URL_SAFE or Base64.NO_WRAP or Base64.NO_PADDING)

              fun newVerifier(): String {
                  val b = ByteArray(48)
                  SecureRandom().nextBytes(b)
                  return b64(b)
              }

              fun challenge(verifier: String): String =
                  b64(MessageDigest.getInstance("SHA-256").digest(verifier.toByteArray(Charsets.US_ASCII)))

              fun authUrl(challenge: String, state: String): String {
                  val params = listOf(
                      "audience" to "https://api.yotoplay.com",
                      "scope" to SCOPE,
                      "response_type" to "code",
                      "client_id" to CLIENT_ID,
                      "code_challenge" to challenge,
                      "code_challenge_method" to "S256",
                      "redirect_uri" to REDIRECT,
                      "state" to state
                  )
                  return "https://login.yotoplay.com/authorize?" +
                      params.joinToString("&") { it.first + "=" + URLEncoder.encode(it.second, "UTF-8") }
              }

              // Returns an error message, or null on success.
              fun exchange(ctx: Context, code: String, verifier: String): String? {
                  val body = FormBody.Builder()
                      .add("grant_type", "authorization_code")
                      .add("client_id", CLIENT_ID)
                      .add("code_verifier", verifier)
                      .add("code", code)
                      .add("redirect_uri", REDIRECT)
                      .build()
                  return post(ctx, body, null)
              }

              private fun post(ctx: Context, body: FormBody, oldRefresh: String?): String? {
                  return try {
                      val req = Request.Builder()
                          .url("https://login.yotoplay.com/oauth/token")
                          .post(body)
                          .build()
                      http.newCall(req).execute().use { r ->
                          val s = r.body?.string() ?: ""
                          if (!r.isSuccessful) {
                              "Token error ${r.code}: ${s.take(160)}"
                          } else {
                              val j = JSONObject(s)
                              Store.put(ctx, "access", j.getString("access_token"))
                              val nr = j.str("refresh_token").ifEmpty { oldRefresh.orEmpty() }
                              if (nr.isNotEmpty()) Store.put(ctx, "refresh", nr)
                              Store.putLong(
                                  ctx, "exp",
                                  System.currentTimeMillis() + j.optLong("expires_in", 3600L) * 1000L
                              )
                              null
                          }
                      }
                  } catch (e: Exception) {
                      "Token error: ${e.message}"
                  }
              }

              // Refresh tokens are single use, so everything goes through one lock.
              fun accessToken(ctx: Context): String? {
                  synchronized(lock) {
                      val at = Store.str(ctx, "access")
                      if (at != null && System.currentTimeMillis() < Store.long(ctx, "exp") - 60_000L) return at
                      val rt = Store.str(ctx, "refresh") ?: return null
                      val body = FormBody.Builder()
                          .add("grant_type", "refresh_token")
                          .add("client_id", CLIENT_ID)
                          .add("refresh_token", rt)
                          .build()
                      val err = post(ctx, body, rt)
                      if (err != null) {
                          Store.put(ctx, "lastErr", err)
                          Store.log(ctx, err)
                          return null
                      }
                      return Store.str(ctx, "access")
                  }
              }
          }
          EOF

          cat > $D/YotoApi.kt <<'EOF'
          package com.timmytwoplates.yoto

          import android.content.Context
          import okhttp3.OkHttpClient
          import okhttp3.Request
          import org.json.JSONArray
          import org.json.JSONObject
          import org.json.JSONTokener

          object YotoApi {
              private const val BASE = "https://api.yotoplay.com"
              private val http = OkHttpClient()

              fun get(ctx: Context, path: String): String? {
                  val tok = Auth.accessToken(ctx)
                  if (tok == null) {
                      Store.log(ctx, "GET $path: no token")
                      return null
                  }
                  val req = Request.Builder()
                      .url(BASE + path)
                      .header("Authorization", "Bearer $tok")
                      .build()
                  return try {
                      http.newCall(req).execute().use { r ->
                          val s = r.body?.string() ?: ""
                          if (r.isSuccessful) {
                              s
                          } else {
                              Store.log(ctx, "GET $path -> ${r.code}")
                              null
                          }
                      }
                  } catch (e: Exception) {
                      Store.log(ctx, "GET $path failed: ${e.message}")
                      null
                  }
              }

              // (deviceId, name)
              fun devices(ctx: Context): List<Pair<String, String>> {
                  val s = get(ctx, "/device-v2/devices/mine") ?: return emptyList()
                  return try {
                      val a = JSONObject(s).optJSONArray("devices") ?: return emptyList()
                      (0 until a.length()).map {
                          val o = a.getJSONObject(it)
                          o.str("deviceId") to o.str("name").ifEmpty { "Yoto player" }
                      }
                  } catch (e: Exception) {
                      Store.log(ctx, "devices parse: ${e.message}")
                      emptyList()
                  }
              }

              // The inner card object (has content.chapters[].tracks[]).
              fun content(ctx: Context, cardId: String): JSONObject? {
                  val s = get(ctx, "/content/$cardId") ?: return null
                  return try {
                      val root = JSONObject(s)
                      root.optJSONObject("card") ?: root
                  } catch (e: Exception) {
                      null
                  }
              }

              private fun firstArray(o: JSONObject): JSONArray? {
                  val keys = o.keys()
                  while (keys.hasNext()) {
                      val v = o.opt(keys.next())
                      if (v is JSONArray) return v
                  }
                  val keys2 = o.keys()
                  while (keys2.hasNext()) {
                      val v = o.opt(keys2.next())
                      if (v is JSONObject) {
                          val r = firstArray(v)
                          if (r != null) return r
                      }
                  }
                  return null
              }

              // Merges your MYO cards (documented) with the family library (not in the public docs,
              // parsed loosely and ignored if it fails). Returns the number of cards.
              fun library(ctx: Context): Int {
                  val map = LinkedHashMap<String, Card>()

                  get(ctx, "/content/mine")?.let { s ->
                      try {
                          val a = JSONObject(s).optJSONArray("cards")
                          if (a != null) {
                              for (i in 0 until a.length()) {
                                  val o = a.getJSONObject(i)
                                  val id = o.str("cardId")
                                  if (id.isEmpty()) continue
                                  map[id] = Card(id, o.str("title"), findStr(o, "imageL"))
                              }
                          }
                      } catch (e: Exception) {
                          Store.log(ctx, "mine parse: ${e.message}")
                      }
                  }

                  get(ctx, "/card/family/library")?.let { s ->
                      try {
                          val root = JSONTokener(s).nextValue()
                          val arr: JSONArray? = when (root) {
                              is JSONArray -> root
                              is JSONObject -> root.optJSONArray("cards")
                                  ?: root.optJSONArray("library")
                                  ?: firstArray(root)
                              else -> null
                          }
                          if (arr != null) {
                              for (i in 0 until arr.length()) {
                                  val o = arr.optJSONObject(i) ?: continue
                                  var id = o.str("cardId")
                                  if (id.isEmpty()) id = o.str("id")
                                  if (id.isEmpty()) id = findStr(o, "cardId")
                                  if (id.isEmpty() || map.containsKey(id)) continue
                                  map[id] = Card(id, findStr(o, "title"), findStr(o, "imageL"))
                              }
                          }
                      } catch (e: Exception) {
                          Store.log(ctx, "family library parse: ${e.message}")
                      }
                  }

                  if (map.isNotEmpty()) Library.save(ctx, map.values.toList())
                  Store.log(ctx, "Library: ${map.size} cards")
                  return map.size
              }
          }
          EOF

      - name: Write Kotlin sources (MQTT and player control)
        run: |
          D=app/src/main/java/com/timmytwoplates/yoto

          cat > $D/Mqtt.kt <<'EOF'
          package com.timmytwoplates.yoto

          import okhttp3.OkHttpClient
          import okhttp3.Request
          import okhttp3.Response
          import okhttp3.WebSocket
          import okhttp3.WebSocketListener
          import okio.ByteString
          import okio.ByteString.Companion.toByteString
          import org.json.JSONObject
          import java.io.ByteArrayOutputStream
          import java.util.concurrent.CountDownLatch
          import java.util.concurrent.LinkedBlockingQueue
          import java.util.concurrent.TimeUnit

          // Minimal MQTT 3.1.1 client over an OkHttp WebSocket. QoS 0 only, one short-lived session.
          class Mqtt(private val deviceId: String, private val token: String) {
              private val client = OkHttpClient.Builder().build()
              private var ws: WebSocket? = null
              private var acc = ByteArray(0)
              private val connackLatch = CountDownLatch(1)
              private val subackLatch = CountDownLatch(1)

              @Volatile
              private var rc = -1

              @Volatile
              var error: String? = null

              val inbox = LinkedBlockingQueue<Pair<String, JSONObject>>()

              private fun utf(s: String): ByteArray {
                  val b = s.toByteArray(Charsets.UTF_8)
                  return byteArrayOf((b.size shr 8).toByte(), (b.size and 0xFF).toByte()) + b
              }

              private fun remLen(n: Int): ByteArray {
                  val o = ByteArrayOutputStream()
                  var x = n
                  do {
                      var d = x % 128
                      x /= 128
                      if (x > 0) d = d or 0x80
                      o.write(d)
                  } while (x > 0)
                  return o.toByteArray()
              }

              private fun packet(first: Int, body: ByteArray): ByteArray =
                  byteArrayOf(first.toByte()) + remLen(body.size) + body

              private fun connectPacket(): ByteArray {
                  val body = utf("MQTT") +
                      byteArrayOf(4, 0xC2.toByte(), 0x01, 0x2C) +
                      utf("DASH" + deviceId) +
                      utf(deviceId + "?x-amz-customauthorizer-name=PublicJWTAuthorizer") +
                      utf(token)
                  return packet(0x10, body)
              }

              fun connect(timeoutMs: Long): Boolean {
                  val req = Request.Builder()
                      .url("wss://aqrphjqbp3u2z-ats.iot.eu-west-2.amazonaws.com/mqtt")
                      .header("Sec-WebSocket-Protocol", "mqtt")
                      .build()
                  ws = client.newWebSocket(req, object : WebSocketListener() {
                      override fun onOpen(webSocket: WebSocket, response: Response) {
                          webSocket.send(connectPacket().toByteString())
                      }

                      override fun onMessage(webSocket: WebSocket, bytes: ByteString) {
                          feed(bytes.toByteArray())
                      }

                      override fun onClosing(webSocket: WebSocket, code: Int, reason: String) {
                          webSocket.close(1000, null)
                      }

                      override fun onClosed(webSocket: WebSocket, code: Int, reason: String) {
                          connackLatch.countDown()
                          subackLatch.countDown()
                      }

                      override fun onFailure(webSocket: WebSocket, t: Throwable, response: Response?) {
                          val http = if (response != null) " (HTTP " + response.code + ")" else ""
                          error = (t.message ?: t.javaClass.simpleName) + http
                          connackLatch.countDown()
                          subackLatch.countDown()
                      }
                  })
                  connackLatch.await(timeoutMs, TimeUnit.MILLISECONDS)
                  return rc == 0
              }

              fun subscribe(topics: List<String>, timeoutMs: Long): Boolean {
                  var body = byteArrayOf(0, 1)
                  for (t in topics) body += utf(t) + byteArrayOf(0)
                  ws?.send(packet(0x82, body).toByteString())
                  return subackLatch.await(timeoutMs, TimeUnit.MILLISECONDS)
              }

              fun publish(topic: String, payload: String) {
                  ws?.send(packet(0x30, utf(topic) + payload.toByteArray(Charsets.UTF_8)).toByteString())
              }

              fun close() {
                  try {
                      ws?.send(byteArrayOf(0xE0.toByte(), 0).toByteString())
                      ws?.close(1000, null)
                  } catch (e: Exception) {
                  }
                  client.dispatcher.executorService.shutdown()
                  client.connectionPool.evictAll()
              }

              @Synchronized
              private fun feed(b: ByteArray) {
                  acc += b
                  while (true) {
                      if (acc.size < 2) return
                      var mult = 1
                      var len = 0
                      var i = 1
                      var ok = false
                      while (i < acc.size && i <= 4) {
                          val d = acc[i].toInt() and 0xFF
                          len += (d and 0x7F) * mult
                          mult *= 128
                          i++
                          if (d and 0x80 == 0) {
                              ok = true
                              break
                          }
                      }
                      if (!ok) return
                      val total = i + len
                      if (acc.size < total) return
                      val first = acc[0].toInt() and 0xFF
                      val body = acc.copyOfRange(i, total)
                      acc = acc.copyOfRange(total, acc.size)
                      handle(first shr 4, first and 0x0F, body)
                  }
              }

              private fun handle(type: Int, flags: Int, body: ByteArray) {
                  when (type) {
                      2 -> {
                          rc = if (body.size >= 2) body[1].toInt() else -2
                          if (rc != 0) error = "CONNACK code $rc"
                          connackLatch.countDown()
                      }
                      9 -> subackLatch.countDown()
                      3 -> {
                          val tl = ((body[0].toInt() and 0xFF) shl 8) or (body[1].toInt() and 0xFF)
                          val topic = String(body, 2, tl, Charsets.UTF_8)
                          var pos = 2 + tl
                          val qos = (flags shr 1) and 3
                          if (qos > 0) {
                              if (qos == 1) {
                                  ws?.send(byteArrayOf(0x40, 2, body[pos], body[pos + 1]).toByteString())
                              }
                              pos += 2
                          }
                          val payload = String(body, pos, body.size - pos, Charsets.UTF_8)
                          val j = try {
                              JSONObject(payload)
                          } catch (e: Exception) {
                              JSONObject()
                          }
                          inbox.put(Pair(topic, j))
                      }
                  }
              }
          }
          EOF

          cat > $D/Player.kt <<'EOF'
          package com.timmytwoplates.yoto

          import android.content.Context
          import org.json.JSONObject
          import java.util.concurrent.TimeUnit

          class Session(val deviceId: String, val m: Mqtt) {
              fun cmd(path: String, body: String = "{}") {
                  m.publish("device/$deviceId/command/$path", body)
              }

              fun events(timeoutMs: Long = 2500): JSONObject? {
                  m.inbox.clear()
                  cmd("events/request")
                  val end = System.currentTimeMillis() + timeoutMs
                  while (true) {
                      val left = end - System.currentTimeMillis()
                      if (left <= 0) return null
                      val p = m.inbox.poll(left, TimeUnit.MILLISECONDS) ?: return null
                      if (p.first.endsWith("/data/events")) return p.second
                  }
              }

              // Waits for the OK/FAIL ack of a command, e.g. key "card", "volume", "sleep-timer".
              fun response(key: String, timeoutMs: Long): String? {
                  val end = System.currentTimeMillis() + timeoutMs
                  while (true) {
                      val left = end - System.currentTimeMillis()
                      if (left <= 0) return null
                      val p = m.inbox.poll(left, TimeUnit.MILLISECONDS) ?: return null
                      if (p.first.endsWith("/response")) {
                          val st = p.second.optJSONObject("status")
                          if (st != null && st.has(key)) return st.optString(key)
                      }
                  }
              }
          }

          object Player {
              private val lock = Any()

              // The card URI format is not spelled out in the public docs, so a few are tried and the
              // one the player acknowledges with OK is remembered.
              private val URI_FORMATS = listOf("https://yoto.com/%s", "yoto://card/%s")

              private fun open(ctx: Context): Session? {
                  val tok = Auth.accessToken(ctx)
                  if (tok == null) {
                      Store.put(ctx, "lastErr", "Sign in from the app first")
                      return null
                  }
                  var dev = Store.str(ctx, "deviceId")
                  if (dev == null) {
                      val d = YotoApi.devices(ctx).firstOrNull()
                      if (d != null) {
                          dev = d.first
                          Store.put(ctx, "deviceId", d.first)
                          Store.put(ctx, "deviceName", d.second)
                      }
                  }
                  if (dev == null) {
                      Store.put(ctx, "lastErr", "No player found on this account")
                      return null
                  }
                  val m = Mqtt(dev, tok)
                  if (!m.connect(5000)) {
                      val e = "MQTT connect failed: " + (m.error ?: "no CONNACK")
                      Store.put(ctx, "lastErr", e)
                      Store.log(ctx, e)
                      m.close()
                      return null
                  }
                  m.subscribe(
                      listOf("device/$dev/data/events", "device/$dev/data/status", "device/$dev/response"),
                      3000
                  )
                  return Session(dev, m)
              }

              private fun startCard(ctx: Context, s: Session, cardId: String, ck: String?, tk: String?): Boolean {
                  val first = Store.int(ctx, "uriFmt", 0)
                  for (k in URI_FORMATS.indices) {
                      val i = (first + k) % URI_FORMATS.size
                      val o = JSONObject().put("uri", URI_FORMATS[i].format(cardId))
                      if (ck != null) o.put("chapterKey", ck)
                      if (tk != null) o.put("trackKey", tk)
                      o.put("secondsIn", 0)
                      s.m.inbox.clear()
                      s.cmd("card/start", o.toString())
                      val r = s.response("card", 3000)
                      Store.log(ctx, "card/start fmt$i -> " + (r ?: "no ack"))
                      if (r == "OK") {
                          Store.putInt(ctx, "uriFmt", i)
                          return true
                      }
                      if (r == null) return true
                  }
                  return false
              }

              private fun skip(ctx: Context, s: Session, dir: Int): String {
                  val e = s.events() ?: return "Player not responding"
                  val cardId = e.str("cardId")
                  if (cardId.isEmpty()) return "Nothing playing"
                  val ck = e.str("chapterKey")
                  val tk = e.str("trackKey")
                  val pos = e.optInt("position", 0)
                  val c = YotoApi.content(ctx, cardId) ?: return "Couldn't read card contents"
                  val chs = c.optJSONObject("content")?.optJSONArray("chapters") ?: return "Card has no chapters"
                  val flat = ArrayList<Pair<String, String>>()
                  for (i in 0 until chs.length()) {
                      val ch = chs.getJSONObject(i)
                      val trs = ch.optJSONArray("tracks") ?: continue
                      for (j in 0 until trs.length()) {
                          flat.add(Pair(ch.str("key"), trs.getJSONObject(j).str("key")))
                      }
                  }
                  val idx = flat.indexOfFirst { it.first == ck && it.second == tk }
                  if (idx < 0) return "Current track not found in card"
                  val target = if (dir < 0) {
                      if (pos > 3) idx else maxOf(0, idx - 1)
                  } else {
                      idx + 1
                  }
                  if (target >= flat.size) return "Last track"
                  return if (startCard(ctx, s, cardId, flat[target].first, flat[target].second)) "" else "Couldn't change track"
              }

              // Returns "" on success, otherwise a short message to toast.
              fun perform(ctx0: Context, action: String, arg: String?): String {
                  val ctx = ctx0.applicationContext
                  synchronized(lock) {
                      Store.put(ctx, "lastErr", null)
                      val s = try {
                          open(ctx)
                      } catch (e: Exception) {
                          Store.put(ctx, "lastErr", "Error: " + e.message)
                          null
                      }
                      if (s == null) {
                          YotoWidget.refreshAll(ctx)
                          return Store.str(ctx, "lastErr") ?: "Not connected"
                      }
                      var msg = ""
                      try {
                          when (action) {
                              "toggle" -> {
                                  val e = s.events()
                                  val playing = e?.str("playbackStatus") == "playing"
                                  s.m.inbox.clear()
                                  s.cmd(if (playing) "card/pause" else "card/resume")
                                  s.response("card", 2000)
                              }
                              "volup", "voldown" -> {
                                  val e = s.events()
                                  val cur = e?.optInt("volume", -1) ?: -1
                                  if (cur < 0) {
                                      msg = "Volume unknown"
                                  } else {
                                      val v = (cur + (if (action == "volup") 6 else -6)).coerceIn(0, 100)
                                      s.m.inbox.clear()
                                      s.cmd("volume/set", "{\"volume\":" + v + "}")
                                      s.response("volume", 2000)
                                  }
                              }
                              "sleep" -> {
                                  val sec = arg?.toIntOrNull() ?: 0
                                  s.m.inbox.clear()
                                  s.cmd("sleep-timer/set", "{\"seconds\":" + sec + "}")
                                  s.response("sleep-timer", 2000)
                              }
                              "play" -> {
                                  if (arg == null || !startCard(ctx, s, arg, null, null)) msg = "Couldn't start card"
                              }
                              "next" -> msg = skip(ctx, s, 1)
                              "prev" -> msg = skip(ctx, s, -1)
                              "refresh" -> {
                                  if (Library.stale(ctx)) YotoApi.library(ctx)
                              }
                          }
                          if (action != "refresh") Thread.sleep(600)
                          val e2 = s.events()
                          if (e2 != null && e2.length() > 0) {
                              Store.put(ctx, "np", e2.toString())
                              Store.put(ctx, "stale", "0")
                          } else {
                              Store.put(ctx, "stale", "1")
                          }
                      } catch (e: Exception) {
                          Store.log(ctx, action + " error: " + e.message)
                          msg = "Error: " + e.message
                      } finally {
                          s.m.close()
                          YotoWidget.refreshAll(ctx)
                      }
                      return msg
                  }
              }
          }
          EOF

      - name: Write Kotlin sources (widget and activities)
        run: |
          D=app/src/main/java/com/timmytwoplates/yoto

          cat > $D/YotoWidget.kt <<'EOF'
          package com.timmytwoplates.yoto

          import android.app.PendingIntent
          import android.appwidget.AppWidgetManager
          import android.appwidget.AppWidgetProvider
          import android.content.ComponentName
          import android.content.Context
          import android.content.Intent
          import android.net.Uri
          import android.view.View
          import android.widget.RemoteViews
          import android.widget.RemoteViewsService
          import android.graphics.BitmapFactory
          import org.json.JSONObject

          class YotoWidget : AppWidgetProvider() {

              companion object {
                  const val ACTION_CMD = "com.timmytwoplates.yoto.CMD"
                  const val ACTION_PLAY = "com.timmytwoplates.yoto.PLAY"

                  fun refreshAll(ctx: Context) {
                      val mgr = AppWidgetManager.getInstance(ctx)
                      val ids = mgr.getAppWidgetIds(ComponentName(ctx, YotoWidget::class.java))
                      for (id in ids) render(ctx, mgr, id)
                  }

                  private fun cmdPi(ctx: Context, a: String): PendingIntent {
                      val i = Intent(ctx, YotoWidget::class.java).setAction(ACTION_CMD).putExtra("a", a)
                      return PendingIntent.getBroadcast(
                          ctx, a.hashCode(), i,
                          PendingIntent.FLAG_IMMUTABLE or PendingIntent.FLAG_UPDATE_CURRENT
                      )
                  }

                  fun render(ctx: Context, mgr: AppWidgetManager, id: Int) {
                      val rv = RemoteViews(ctx.packageName, R.layout.widget)
                      val np: JSONObject? = try {
                          Store.str(ctx, "np")?.let { JSONObject(it) }
                      } catch (e: Exception) {
                          null
                      }
                      val signed = Auth.signedIn(ctx)
                      val playing = np?.str("playbackStatus") == "playing"
                      val track = np?.str("trackTitle").orEmpty()

                      val line1 = when {
                          !signed -> "Open Yoto Remote to sign in"
                          track.isNotEmpty() -> track
                          else -> "Nothing playing"
                      }
                      val parts = ArrayList<String>()
                      if (np != null) {
                          val ct = Library.title(ctx, np.str("cardId"))
                          if (ct.isNotEmpty()) parts.add(ct)
                          if (np.has("volume")) parts.add("vol " + np.optInt("volume") + "%")
                          if (np.optBoolean("sleepTimerActive", false)) parts.add("sleep timer on")
                      }
                      if (signed && Store.str(ctx, "stale") == "1") parts.add("player not responding")

                      rv.setTextViewText(R.id.title, line1)
                      rv.setTextViewText(R.id.subtitle, parts.joinToString(" · "))
                      rv.setImageViewResource(R.id.btn_play, if (playing) R.drawable.ic_pause else R.drawable.ic_play)

                      rv.setOnClickPendingIntent(R.id.title_box, cmdPi(ctx, "refresh"))
                      rv.setOnClickPendingIntent(R.id.btn_prev, cmdPi(ctx, "prev"))
                      rv.setOnClickPendingIntent(R.id.btn_play, cmdPi(ctx, "toggle"))
                      rv.setOnClickPendingIntent(R.id.btn_next, cmdPi(ctx, "next"))
                      rv.setOnClickPendingIntent(R.id.btn_vold, cmdPi(ctx, "voldown"))
                      rv.setOnClickPendingIntent(R.id.btn_volu, cmdPi(ctx, "volup"))

                      val flags = PendingIntent.FLAG_IMMUTABLE or PendingIntent.FLAG_UPDATE_CURRENT
                      val sleepIntent = Intent(ctx, SleepActivity::class.java).addFlags(Intent.FLAG_ACTIVITY_NEW_TASK)
                      rv.setOnClickPendingIntent(R.id.btn_sleep, PendingIntent.getActivity(ctx, 77, sleepIntent, flags))
                      val mainIntent = Intent(ctx, MainActivity::class.java).addFlags(Intent.FLAG_ACTIVITY_NEW_TASK)
                      rv.setOnClickPendingIntent(R.id.empty, PendingIntent.getActivity(ctx, 78, mainIntent, flags))

                      val svc = Intent(ctx, CoversService::class.java)
                          .putExtra(AppWidgetManager.EXTRA_APPWIDGET_ID, id)
                      svc.data = Uri.parse(svc.toUri(Intent.URI_INTENT_SCHEME))
                      rv.setRemoteAdapter(R.id.grid, svc)
                      rv.setEmptyView(R.id.grid, R.id.empty)
                      val tpl = Intent(ctx, YotoWidget::class.java).setAction(ACTION_PLAY)
                      rv.setPendingIntentTemplate(
                          R.id.grid,
                          PendingIntent.getBroadcast(
                              ctx, 20, tpl,
                              PendingIntent.FLAG_MUTABLE or PendingIntent.FLAG_UPDATE_CURRENT
                          )
                      )

                      mgr.updateAppWidget(id, rv)
                      mgr.notifyAppWidgetViewDataChanged(id, R.id.grid)
                  }
              }

              override fun onUpdate(ctx: Context, mgr: AppWidgetManager, ids: IntArray) {
                  for (id in ids) render(ctx, mgr, id)
                  work(ctx, "refresh", null)
              }

              override fun onReceive(ctx: Context, intent: Intent) {
                  when (intent.action) {
                      ACTION_CMD -> work(ctx, intent.getStringExtra("a") ?: "refresh", null)
                      ACTION_PLAY -> {
                          val id = intent.getStringExtra("cardId")
                          if (id != null) work(ctx, "play", id)
                      }
                      else -> super.onReceive(ctx, intent)
                  }
              }

              private fun work(ctx: Context, a: String, arg: String?) {
                  val pr = goAsync()
                  val app = ctx.applicationContext
                  Thread {
                      try {
                          val msg = Player.perform(app, a, arg)
                          if (msg.isNotEmpty()) toast(app, msg)
                      } finally {
                          pr.finish()
                      }
                  }.start()
              }
          }

          class CoversService : RemoteViewsService() {
              override fun onGetViewFactory(intent: Intent): RemoteViewsFactory = CoversFactory(applicationContext)
          }

          class CoversFactory(private val ctx: Context) : RemoteViewsService.RemoteViewsFactory {
              private var items: List<Card> = emptyList()

              override fun onCreate() {}

              override fun onDataSetChanged() {
                  items = Library.load(ctx).take(80)
                  for (c in items) Covers.ensure(ctx, c)
              }

              override fun onDestroy() {}

              override fun getCount(): Int = items.size

              override fun getViewAt(position: Int): RemoteViews {
                  val rv = RemoteViews(ctx.packageName, R.layout.cover_item)
                  if (position >= items.size) return rv
                  val c = items[position]
                  val f = Covers.file(ctx, c.id)
                  val bmp = if (f.exists()) BitmapFactory.decodeFile(f.path) else null
                  if (bmp != null) {
                      rv.setImageViewBitmap(R.id.cover, bmp)
                      rv.setViewVisibility(R.id.label, View.GONE)
                  } else {
                      rv.setImageViewResource(R.id.cover, R.drawable.cell_bg)
                      rv.setTextViewText(R.id.label, c.title)
                      rv.setViewVisibility(R.id.label, View.VISIBLE)
                  }
                  rv.setOnClickFillInIntent(R.id.cell, Intent().putExtra("cardId", c.id))
                  return rv
              }

              override fun getLoadingView(): RemoteViews? = null

              override fun getViewTypeCount(): Int = 1

              override fun getItemId(position: Int): Long = position.toLong()

              override fun hasStableIds(): Boolean = false
          }
          EOF


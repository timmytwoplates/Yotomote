                  status = TextView(this)
                  status.textSize = 16f
                  root.addView(status)

                  fun btn(label: String, f: () -> Unit) {
                      val b = Button(this)
                      b.text = label
                      b.setOnClickListener { f() }
                      root.addView(b)
                  }
                  btn("Sign in with Yoto") { signIn() }
                  btn("Choose player") { choosePlayer() }
                  btn("Refresh cards") {
                      bg("Refreshing cards...") {
                          YotoApi.library(this)
                          YotoWidget.refreshAll(this)
                          ""
                      }
                  }
                  btn("Refresh player now") {
                      bg("Contacting player...") { Player.perform(this, "refresh", null) }
                  }

                  logView = TextView(this)
                  logView.textSize = 11f
                  logView.typeface = Typeface.MONOSPACE
                  logView.setPadding(0, 24, 0, 0)
                  root.addView(logView)

                  val sv = ScrollView(this)
                  sv.addView(root)
                  setContentView(sv)
              }

              override fun onResume() {
                  super.onResume()
                  refresh()
              }

              private fun refresh() {
                  val signed = Auth.signedIn(this)
                  val n = Library.load(this).size
                  val err = Store.str(this, "lastErr")
                  status.text = "Signed in: " + (if (signed) "yes" else "no") +
                      "\nPlayer: " + (Store.str(this, "deviceName") ?: "none") +
                      "\nCards loaded: " + n +
                      (if (err != null) "\nLast error: " + err else "")
                  logView.text = Store.str(this, "log") ?: ""
              }

              private fun bg(msg: String, work: () -> String) {
                  status.text = msg
                  Thread {
                      val r = try {
                          work()
                      } catch (e: Exception) {
                          "Error: " + e.message
                      }
                      runOnUiThread {
                          refresh()
                          if (r.isNotEmpty()) Toast.makeText(this, r, Toast.LENGTH_LONG).show()
                      }
                  }.start()
              }

              private fun choosePlayer() {
                  Thread {
                      val d = YotoApi.devices(this)
                      runOnUiThread {
                          if (d.isEmpty()) {
                              Toast.makeText(this, "No players found (are you signed in?)", Toast.LENGTH_LONG).show()
                          } else {
                              AlertDialog.Builder(this)
                                  .setTitle("Choose player")
                                  .setItems(d.map { it.second }.toTypedArray()) { _, i ->
                                      Store.put(this, "deviceId", d[i].first)
                                      Store.put(this, "deviceName", d[i].second)
                                      refresh()
                                  }
                                  .show()
                          }
                      }
                  }.start()
              }

              private fun signIn() {
                  val verifier = Auth.newVerifier()
                  val state = Auth.newVerifier().take(16)
                  try {
                      Auth.listener?.close()
                  } catch (e: Exception) {
                  }
                  val server = try {
                      ServerSocket(8787, 1, InetAddress.getByName("127.0.0.1"))
                  } catch (e: Exception) {
                      Toast.makeText(this, "Can't listen on port 8787: " + e.message, Toast.LENGTH_LONG).show()
                      return
                  }
                  Auth.listener = server
                  Thread {
                      try {
                          server.soTimeout = 180000
                          val sock = server.accept()
                          val line = sock.getInputStream().bufferedReader().readLine() ?: ""
                          val path = line.split(" ").getOrNull(1) ?: ""
                          val uri = Uri.parse("http://127.0.0.1" + path)
                          val code = uri.getQueryParameter("code")
                          val st = uri.getQueryParameter("state")
                          val oauthErr = uri.getQueryParameter("error_description") ?: uri.getQueryParameter("error")
                          val ok = code != null && st == state
                          val headline = if (ok) "Signed in" else "Sign-in failed"
                          val html = "<html><body style='font-family:sans-serif;text-align:center;margin-top:20vh'>" +
                              "<h2>" + headline + "</h2><p>Return to Yoto Remote.</p></body></html>"
                          val bytes = html.toByteArray()
                          val out = sock.getOutputStream()
                          out.write(
                              ("HTTP/1.1 200 OK\r\nContent-Type: text/html; charset=utf-8\r\n" +
                                  "Connection: close\r\nContent-Length: " + bytes.size + "\r\n\r\n").toByteArray()
                          )
                          out.write(bytes)
                          out.flush()
                          sock.close()
                          server.close()
                          if (!ok || code == null) {
                              Store.log(this, "Sign-in failed: " + (oauthErr ?: "state mismatch"))
                          } else {
                              val e = Auth.exchange(this, code, verifier)
                              Store.log(this, e ?: "Signed in")
                              if (e == null) {
                                  if (Store.str(this, "deviceId") == null) {
                                      val d = YotoApi.devices(this).firstOrNull()
                                      if (d != null) {
                                          Store.put(this, "deviceId", d.first)
                                          Store.put(this, "deviceName", d.second)
                                      }
                                  }
                                  YotoApi.library(this)
                                  YotoWidget.refreshAll(this)
                              }
                          }
                      } catch (e: Exception) {
                          Store.log(this, "Sign-in: " + e.message)
                      } finally {
                          try {
                              server.close()
                          } catch (e: Exception) {
                          }
                      }
                      runOnUiThread { refresh() }
                  }.start()
                  startActivity(Intent(Intent.ACTION_VIEW, Uri.parse(Auth.authUrl(Auth.challenge(verifier), state))))
              }
          }
          EOF

      - name: Build debug APK
        run: gradle assembleDebug --no-daemon --stacktrace

      - name: Name the APK
        run: cp app/build/outputs/apk/debug/app-debug.apk YotoRemote-${{ github.run_number }}.apk

      - name: Publish release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: build-${{ github.run_number }}
          name: Yoto Remote build ${{ github.run_number }}
          files: YotoRemote-${{ github.run_number }}.apk
